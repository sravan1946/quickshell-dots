# read by Visualizer.qml; one line of 0-100 levels per frame on stdout.
# stereo lays the bands out mirrored: left channel bass..treble reversed, then right,
# so bass sits in the middle of the screen.
[general]
bars = 32
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
channels = stereo
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 77
